name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Harden dependency downloads: retry transient failures and disable HTTP/2
  # multiplexing, which causes intermittent crates.io "HTTP2 framing layer"
  # download errors on GitHub runners.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Path dependencies retain their upstream formatting; check Luvus itself.
      - run: cargo fmt --package luvus --check
      # `-D warnings` is scoped to clippy on our own crate — NOT a global
      # RUSTFLAGS, which would also fail on harmless dependency warnings.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Validate terminal backend contract
        run: |
          python3 examples/uhp/terminal/consumer.py --fixtures
          python3 examples/uhp/terminal/mock_conformance.py
          python3 examples/uhp/consumer.py
          cargo build --locked
          python3 examples/uhp/terminal/live_conformance.py --luvus target/debug/luvus
          python3 examples/uhp/terminal/failure_conformance.py --luvus target/debug/luvus
      - name: Test terminal support crates
        run: |
          cargo test --manifest-path vendor/vte/Cargo.toml --lib
          cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml --lib
      # Cargo strips local patches from published manifests. Verify the exact
      # three-crate registry graph so `cargo install luvus` cannot regress.
      - name: Verify publishable crate graph
        run: |
          cargo package --allow-dirty --manifest-path vendor/vte/Cargo.toml
          cargo package --allow-dirty --manifest-path vendor/alacritty_terminal/Cargo.toml \
            --config 'patch.crates-io.luvus-vte.path="vendor/vte"'
          cargo package --allow-dirty \
            --config 'patch.crates-io.luvus-vte.path="vendor/vte"' \
            --config 'patch.crates-io.luvus-alacritty-terminal.path="vendor/alacritty_terminal"'

  # The optional shitty VT core, built from source because it is a C++ library
  # that is not on crates.io. Runs the suite twice: once compiled in but not
  # selected, so the feature cannot rot, and once with LUVUS_VT_ENGINE=shitty
  # so the whole app is exercised against that engine. Engine-level tests only
  # cover the trait, while the divergences worth catching - row indexing after
  # a screen clear, optional history metrics - showed up in the app suite.
  shitty-engine:
    name: shitty engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Bump with the shitty-vt version in Cargo.toml: the bindings check the
      # header and refuse a facade older than the calls they make.
      SHITTY_REF: 8df70bffd5489bb2e3045055b170d043a24c436c
      # The core is C++26 and this runner's default g++ is 13, which rejects
      # -std=c++26 outright.
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: pg83/shitty
          ref: ${{ env.SHITTY_REF }}
          path: .shitty
      - name: Cache the built VT core
        id: shitty-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/shitty-vt
          key: shitty-vt-${{ runner.os }}-${{ env.SHITTY_REF }}
      # The build probes for everything the terminal can link, including the
      # renderer, even when only the headless facade is being packaged.
      - name: Install the C++ toolchain
        if: steps.shitty-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-14 g++-14 make perl pkg-config python3 ragel \
            libfreetype-dev libfontconfig-dev libharfbuzz-dev \
            libxkbcommon-dev libvulkan-dev libwayland-dev wayland-protocols \
            glslang-tools librsvg2-bin libncurses-dev
      - name: Build libshitty_vt
        if: steps.shitty-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shitty-vt"
          cd .shitty
          ./build tgz
          tar xzf .build/shitty_vt.tgz -C "$RUNNER_TEMP/shitty-vt"
      - name: Point pkg-config and the loader at it
        run: |
          prefix=$(echo "$RUNNER_TEMP"/shitty-vt/shitty_vt-*)
          test -f "$prefix/lib/pkgconfig/shitty_vt.pc" || {
            echo "no shitty_vt.pc under $prefix" >&2
            exit 1
          }
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features shitty-engine --all-targets -- -D warnings
      - name: Test with the engine compiled in but not selected
        run: cargo test --locked --features shitty-engine
      - name: Test with the engine selected
        env:
          LUVUS_VT_ENGINE: shitty
        run: cargo test --locked --features shitty-engine

  # macOS is a primary platform and ships native Apple-silicon/Intel binaries;
  # run the full test suite there too, not just at release-tag time.
  macos:
    name: macos test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Validate terminal backend contract
        run: |
          python3 examples/uhp/terminal/consumer.py --fixtures
          python3 examples/uhp/terminal/mock_conformance.py
          python3 examples/uhp/consumer.py
          cargo build --locked
          python3 examples/uhp/terminal/live_conformance.py --luvus target/debug/luvus
          python3 examples/uhp/terminal/failure_conformance.py --luvus target/debug/luvus

  windows:
    name: windows protocol · ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package luvus --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test Windows protocol boundaries
        shell: pwsh
        run: |
          cargo test --locked platform::windows::tests
          cargo test --locked platform::tests::no_window_keeps_the_command_working
          cargo test --locked ipc::transport::windows_
          cargo test --locked app::backend::tests
          cargo test --locked terminal::backend::tests
          cargo test --locked altgr
          cargo test --locked diff::git::tests::tree_tint_uses_nested_visible_spelling_and_new_rename_path
          cargo test --locked agent::tests::claude_project_dir_encodes_every_non_alphanumeric
      - name: Validate published protocol fixtures
        shell: pwsh
        run: |
          python examples/uhp/terminal/consumer.py --fixtures
          if ($LASTEXITCODE -ne 0) { throw "UHP terminal fixture validation failed" }
          python examples/uhp/consumer.py
          if ($LASTEXITCODE -ne 0) { throw "UHP fixture validation failed" }
      - name: Validate named pipes and ConPTY live
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw "Windows debug build failed" }
          .\examples\uhp\terminal\live_conformance.ps1 `
            -Luvus .\target\debug\luvus.exe

  # Known-vulnerability scan of the dependency tree (RustSec advisory DB).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Validate the Nix flake (packaging for NixOS / `nix run`). Evaluates every
  # output and builds the package, so a broken derivation fails CI instead of
  # only surfacing when a Nix user tries to install. Reproducible once flake.lock
  # is committed; until then it resolves nixos-unstable fresh each run.
  nix:
    name: nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # `flake check` type-checks/evaluates all outputs; `build` compiles the
      # package so the wrapped binary is proven to link.
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
